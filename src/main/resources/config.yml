# Recreational rounds accept players from every rating division.
queue-countdown-seconds: 15
turn-timeout-seconds: 90
max-strokes-per-hole: 12
disc-shop:
  credits-per-basket: 10
course:
  holes: 18
  seed: 2026
preview:
  enabled: true
  seconds: 6
resource-pack:
  enabled: true
  # Set to a publicly reachable HTTP(S) address for remote players.
  # An empty URL serves the pack to clients connected from this machine.
  url: ""
  local-auto: true
  local-required: true
  required: false
  serve: true
  port: 8088
